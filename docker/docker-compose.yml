services:
  api:
    build: ..
    command: oph-api
    env_file: ../.env.example
    ports: ["8000:8000"]
    depends_on: [postgres, redis, opensearch]
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: oph, POSTGRES_PASSWORD: oph, POSTGRES_DB: oph}
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  opensearch:
    image: opensearchproject/opensearch:2
    environment: {discovery.type: single-node, plugins.security.disabled: "true", OPENSEARCH_INITIAL_ADMIN_PASSWORD: "OpenProcurementHub1!"}
    ports: ["9200:9200"]
  docs:
    image: squidfunk/mkdocs-material
    volumes: ["..:/docs"]
    ports: ["8001:8000"]
  prometheus:
    image: prom/prometheus
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
