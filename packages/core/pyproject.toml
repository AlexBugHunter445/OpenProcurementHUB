[project]
name = "openprocurementhub-core"
version = "0.1.0-alpha.0"
description = "Core domain, database, events, and observability for OpenProcurementHub"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "alembic>=1.13", "structlog>=24.1", "opentelemetry-api>=1.25", "prometheus-client>=0.20", "PyYAML>=6.0"]
[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
