name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install ruff mypy pytest -e packages/core -e packages/connector-sdk -e packages/connector-belgium -e packages/api -e packages/cli -e packages/sdk-python
      - run: ruff check .
      - run: pytest
